# macOS, built and tested on real Macs: Apple Silicon (M1 and later) and Intel.
#
# Built here and not with the other zips on Windows: an Apple Silicon Mac refuses to run a program that isn't signed,
# and the .NET SDK only gives the app its (ad-hoc) signature when it's built on a Mac. Each job builds the
# self-contained app, checks the signature, zips it with its permissions kept (and no .DS_Store), then tests THAT zip:
# unpacked into a folder with a space and "(1)" in its name, it runs the unit tests, goes live to Steam (--steam-selftest:
# anonymous, no account), starts it headless through start.command and checks the dashboard, commands, every button of
# the dashboard in a real browser, encrypted secrets, one copy per config folder, SIGHUP (closing the Terminal) and a
# clean shutdown, updating itself (a broken version put back, a relative --path, another copy in the folder, signatures
# intact) and updating from the newest real GitHub release to this build.
#
# Run it from the Actions tab (or `gh workflow run macos.yml`). With a tag (`-f tag=v1.5.3`) the two zips are also
# added to that release.
name: macos

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to add the zips to (like v1.5.3) - leave empty to only build and test"
        required: false
        default: ""

permissions:
  contents: write   # only used to add the zips to a release when a tag is given

jobs:
  mac:
    name: mac - ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-latest
          - rid: osx-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: build the self-contained app
        run: |
          dotnet publish src/NocatFarm -c Release -o app -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=false -p:DebugType=none --nologo -v q
          cp tools/macos/start.command app/start.command
          cp README.md app/README.md
          chmod +x app/nocatFarm app/start.command
          file app/nocatFarm
          codesign --verify --verbose app/nocatFarm

      - name: zip it (flat, permissions kept, no .DS_Store)
        run: |
          # What Finder leaves in any folder it has shown - put there on purpose, so leaving it out is tested
          touch app/.DS_Store app/wwwroot/.DS_Store
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/NocatFarm/NocatFarm.csproj)
          name="nocat.farm-v${version}_${{ matrix.rid }}.zip"
          (cd app && zip -qry -X "../$name" . -x '.DS_Store' -x '*/.DS_Store')
          unzip -l "$name" | grep -E ' (nocatFarm|start\.command)$'
          # never a bare "! cmd" or "a && b" as a check: bash -e stops for neither, so such a check could never fail
          if unzip -l "$name" | grep 'DS_Store'; then echo "FAIL: .DS_Store in the zip"; exit 1; fi
          # MAC_ZIP, not ZIP: zip reads $ZIP as options of its own, and every zip made later in the job went wrong
          echo "MAC_ZIP=$name" >> "$GITHUB_ENV"

      - name: unpack the zip into a folder with a space and (1) in its name
        run: |
          APP="$PWD/nocat.farm (1)"
          unzip -q "$MAC_ZIP" -d "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
          test -x "$APP/nocatFarm"
          test -x "$APP/start.command"
          codesign --verify --verbose "$APP/nocatFarm"

      - name: unit tests
        run: cd tests/NocatFarm.Tests && dotnet run -c Release

      - name: live Steam connection and idling (anonymous - no account)
        timeout-minutes: 4
        # The unpacked release connects to Steam over WebSocket and TCP, signs in anonymously, sends the idler's
        # games-played message (custom name with emoji first, then 730 and 440), stays on 20s and logs off. Exits 1 on any FAIL.
        run: '"$APP/nocatFarm" --path "$RUNNER_TEMP/steam-selftest" --steam-selftest'

      - name: start it through start.command
        run: |
          mkdir -p "$APP/config"
          echo '{"WebPort":7242,"CheckForUpdates":false,"JoinGroup":false,"OpenBrowserOnStart":false}' > "$APP/config/nocatFarm.json"
          echo '{"Enabled":false,"SteamLogin":"not_a_real_account"}' > "$APP/config/demo.json"
          # quarantined like a real download, so start.command's own fix is tested too
          xattr -w com.apple.quarantine "0081;00000000;Safari;" "$APP/nocatFarm" || true
          ("$APP/start.command" --no-gui < /dev/null > run.log 2>&1 & echo $! > pid)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:7242/api/status > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:7242/api/status | tee status.json | head -c 300; echo
          grep -q '"Version"' status.json
          if xattr -p com.apple.quarantine "$APP/nocatFarm" 2>/dev/null; then echo "FAIL: start.command left the quarantine on"; exit 1; fi

      - name: a second copy on the same folder says so and exits
        run: |
          set +e
          (cd "$APP" && ./nocatFarm --no-gui < /dev/null > "$GITHUB_WORKSPACE/second.log" 2>&1)
          code=$?
          set -e
          cat second.log
          [ "$code" -ne 0 ]
          grep -q 'already running for this folder' second.log
          grep -q "process $(head -n 1 "$APP/config/state/instance.lock")" second.log

      - name: dashboard, commands and settings
        run: |
          cmd() { curl -sf -X POST http://127.0.0.1:7242/api/command -H 'Content-Type: application/json' -d "{\"line\":\"$1\"}"; echo; }
          curl -sf http://127.0.0.1:7242/ | grep -qi '<html'
          curl -sf http://127.0.0.1:7242/logo-liquid.gif -o /dev/null
          cmd version | tee out.txt; grep -qi 'nocat' out.txt
          cmd 'status' | tee out.txt; grep -q 'demo' out.txt
          cmd 'dashboard' | tee out.txt; grep -q '127.0.0.1:7242' out.txt
          cmd 'log folder' | tee out.txt; grep -q 'logs' out.txt
          cmd 'set UpdateCheckHours 5' | tee out.txt; grep -q 'UpdateCheckHours = 5' out.txt
          grep -q '"UpdateCheckHours": 5' "$APP/config/nocatFarm.json"
          cmd 'backup' | tee out.txt; grep -q 'Backup saved' out.txt
          [ "$(stat -f %Lp "$APP/backups")" = "700" ]
          for z in "$APP"/backups/*.zip; do [ "$(stat -f %Lp "$z")" = "600" ] || { echo "$z isn't 600"; exit 1; }; done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: every button, switch, tab, chip and form of the dashboard, in a real browser
        run: |
          (cd tests/e2e && npm ci --no-audit --no-fund && npx playwright install chromium)
          sh tests/e2e/run.sh "$APP" 7377

      - name: secrets are encrypted on disk
        run: |
          curl -sf -X POST http://127.0.0.1:7242/api/command -H 'Content-Type: application/json' -d '{"line":"set TelegramBotToken 123456789:not-a-real-token"}' > /dev/null
          grep -q 'nocat-aes1:' "$APP/config/nocatFarm.json"
          if grep -q 'not-a-real-token' "$APP/config/nocatFarm.json"; then echo "FAIL: the token is on disk as it was typed"; exit 1; fi
          test -f "$APP/config/state/secret.key"
          [ "$(stat -f %Lp "$APP/config/state/secret.key")" = "600" ]

      - name: signing in from outside (lockouts, switching itself off, the visitor log)
        run: sh tests/security-check.sh http://127.0.0.1:7242 "$APP/config"

      - name: clean shutdown
        run: |
          p=$(head -n 1 "$APP/config/state/instance.lock")
          kill -TERM "$p"
          for i in $(seq 1 30); do kill -0 "$p" 2>/dev/null || break; sleep 1; done
          if kill -0 "$p" 2>/dev/null; then echo "FAIL: still running 30s after SIGTERM"; exit 1; fi
          grep -q 'shutting down' run.log

      - name: one copy per folder, SIGHUP (closing the Terminal) and nohup
        run: sh tests/instance-and-signals.sh "$APP"

      - name: updating itself, putting a broken version back, and another copy in the folder
        run: sh tests/update-rollback.sh ${{ matrix.rid }} "$APP"

      - name: updating from the newest GitHub release to this build
        run: |
          # This build as 9.9.9, made the way the release zip is made
          dotnet publish src/NocatFarm -c Release -o new -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=false -p:DebugType=none -p:Version=9.9.9 --nologo -v q
          cp tools/macos/start.command new/start.command && cp README.md new/README.md && chmod +x new/nocatFarm new/start.command
          (cd new && zip -qry -X ../new-9.9.9.zip . -x '.DS_Store' -x '*/.DS_Store')
          sh tests/update-from-release.sh ${{ matrix.rid }} new-9.9.9.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MAC_ZIP }}
          path: ${{ env.MAC_ZIP }}
          retention-days: 1   # the release keeps the real copy; these were piling up at 50MB each

      - name: add it to the release
        if: inputs.tag != ''
        run: gh release upload "${{ inputs.tag }}" "$MAC_ZIP" --clobber --repo "${{ github.repository }}"

      - name: log
        if: always()
        run: |
          tail -n 60 run.log || true
          for f in signals-test/*.log upd-test/*.log from-release/run.log; do [ -f "$f" ] && { echo "== $f"; tail -n 30 "$f"; }; done || true
