# Linux and Docker, tested on real machines: x64 and arm64 (a Raspberry Pi 4/5 class CPU).
#
# For each: builds the real release zip (tools/package-release.ps1, the very script that makes the _linux-* zips, file
# modes included), unpacks it into a folder with a space and "(1)" in its name, runs the unit tests, starts it headless
# and checks the dashboard, commands, every button of the dashboard in a real browser, encrypted secrets, one copy per
# config folder, SIGHUP and SIGTERM shutdowns, updating itself (and putting a broken version back) with a relative
# --path, and updating from the newest real GitHub release to this build. Both it and the Docker image also go live to
# Steam (--steam-selftest: anonymous, no account). Then Docker, natively on each CPU, through the real
# docker-compose.example.yml: password required, healthy, backups surviving a re-create, signing in from outside
# through a trusted proxy, a clean stop.
# Run it from the Actions tab (or `gh workflow run linux.yml`).
name: linux

on:
  workflow_dispatch:

permissions:
  contents: read

# Every copy started here - the test copies, the ones an update restarts, the Docker containers - sends its "Count me as
# a user" ping to a dead port on this machine, never to nocat.lol: a test run must never count itself as a user. The
# test configs switch it off as well; this covers a config a copy writes for itself. (The browser test's own copy points
# at tests/e2e/ping-stub.mjs instead.)
env:
  NOCATFARM_PING_URL: http://127.0.0.1:9/api/farm/ping

jobs:
  zip:
    name: zip - ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: build the release zip, the way the release is made
        run: |
          command -v pwsh > /dev/null || { dotnet tool install --global PowerShell && echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH" && export PATH="$PATH:$HOME/.dotnet/tools"; }
          pwsh -NoProfile -File tools/package-release.ps1 -OnlyRid ${{ matrix.rid }}
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/NocatFarm/NocatFarm.csproj)
          zip="dist/nocat.farm-v${version}_${{ matrix.rid }}.zip"
          unzip -l "$zip" | grep -E ' (nocatFarm|README\.md)$'
          # never a bare "! cmd" or "a && b" as a check: bash -e stops for neither, so such a check could never fail
          # names only (-Z1), one a line: a top-level folder of somebody's data, or a zip inside - a backup or an old release
          if unzip -Z1 "$zip" | grep -E '^(config|logs|backups|tokens|state|authenticators)/|\.zip$'; then echo "FAIL: personal folders or a zip in the zip"; exit 1; fi
          # unpacked the way the docs say, into a folder people end up with: a space and "(1)" in it
          APP="$PWD/nocat.farm (1)"
          unzip -q "$zip" -d "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
          [ "$(stat -c %a "$APP/nocatFarm")" = "755" ]
          [ "$(stat -c %a "$APP/README.md")" = "644" ]
          for so in "$APP"/*.so; do [ "$(stat -c %a "$so")" = "755" ] || { echo "$so isn't 755"; exit 1; }; done
          file "$APP/nocatFarm"

      - name: unit tests
        run: cd tests/NocatFarm.Tests && dotnet run -c Release

      - name: live Steam connection and idling (anonymous - no account)
        timeout-minutes: 4
        # The unpacked release connects to Steam over WebSocket and TCP, signs in anonymously, sends the idler's
        # games-played message (custom name with emoji first, then 730 and 440), stays on 20s and logs off. Exits 1 on any FAIL.
        run: '"$APP/nocatFarm" --path "$RUNNER_TEMP/steam-selftest" --steam-selftest'

      - name: start it headless
        run: |
          mkdir -p "$APP/config"
          echo '{"WebPort":7242,"CheckForUpdates":false,"JoinGroup":false,"CountMeAsUser":false}' > "$APP/config/nocatFarm.json"
          echo '{"Enabled":false,"SteamLogin":"not_a_real_account"}' > "$APP/config/demo.json"
          cd "$APP" && (setsid ./nocatFarm --no-gui < /dev/null > "$GITHUB_WORKSPACE/run.log" 2>&1 & echo $! > "$GITHUB_WORKSPACE/pid")
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:7242/api/status > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:7242/api/status | tee "$GITHUB_WORKSPACE/status.json" | head -c 300; echo
          grep -q '"Version"' "$GITHUB_WORKSPACE/status.json"

      - name: a second copy on the same folder says so and exits (from a session of its own)
        run: |
          set +e
          (cd "$APP" && timeout 60 setsid ./nocatFarm --no-gui < /dev/null > "$GITHUB_WORKSPACE/second.log" 2>&1)
          code=$?
          set -e
          cat second.log
          [ "$code" -ne 0 ] || { echo "FAIL: the second copy exited 0"; exit 1; }
          [ "$code" -ne 124 ] || { echo "FAIL: the second copy was still running after 60s"; exit 1; }
          grep -q 'already running for this folder' second.log
          grep -q "process $(cat pid)" second.log
          kill -0 $(cat pid)

      - name: dashboard, commands and settings
        run: |
          cmd() { curl -sf -X POST http://127.0.0.1:7242/api/command -H 'Content-Type: application/json' -d "{\"line\":\"$1\"}"; echo; }
          curl -sf http://127.0.0.1:7242/ | grep -qi '<html'
          curl -sf http://127.0.0.1:7242/app.js | head -c 50 > /dev/null
          cmd version | tee out.txt; grep -qi 'nocat' out.txt
          cmd 'status' | tee out.txt; grep -q 'demo' out.txt
          cmd 'update' | tee out.txt; grep -Eqi 'newest|linux|zip|out' out.txt
          cmd 'dashboard' | tee out.txt; grep -q '127.0.0.1:7242' out.txt
          cmd 'set UpdateCheckHours 5' | tee out.txt; grep -q 'UpdateCheckHours = 5' out.txt
          grep -q '"UpdateCheckHours": 5' "$APP/config/nocatFarm.json"
          cmd 'backup' | tee out.txt; grep -q 'Backup saved' out.txt
          [ "$(stat -c %a "$APP/backups")" = "700" ]
          for z in "$APP"/backups/*.zip; do [ "$(stat -c %a "$z")" = "600" ] || { echo "$z isn't 600"; exit 1; }; done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: every button, switch, tab, chip and form of the dashboard, in a real browser
        run: |
          (cd tests/e2e && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
          sh tests/e2e/run.sh "$APP" 7377

      - name: secrets are encrypted on disk (AES key, owner-only)
        run: |
          curl -sf -X POST http://127.0.0.1:7242/api/command -H 'Content-Type: application/json' -d '{"line":"set TelegramBotToken 123456789:not-a-real-token"}' > /dev/null
          grep -q 'nocat-aes1:' "$APP/config/nocatFarm.json"
          if grep -q 'not-a-real-token' "$APP/config/nocatFarm.json"; then echo "FAIL: the token is on disk as it was typed"; exit 1; fi
          test -f "$APP/config/state/secret.key"
          [ "$(stat -c %a "$APP/config/state/secret.key")" = "600" ]

      - name: signing in from outside (lockouts, switching itself off, the visitor log)
        run: sh tests/security-check.sh http://127.0.0.1:7242 "$APP/config"

      - name: clean shutdown on SIGTERM
        run: |
          kill -TERM $(cat pid)
          for i in $(seq 1 30); do kill -0 $(cat pid) 2>/dev/null || break; sleep 1; done
          if kill -0 $(cat pid) 2>/dev/null; then echo "FAIL: still running 30s after SIGTERM"; exit 1; fi
          grep -q 'shutting down' run.log

      - name: one copy per folder, SIGHUP and nohup
        run: sh tests/instance-and-signals.sh "$APP"

      - name: updating itself, putting a broken version back, and another copy in the folder
        run: sh tests/update-rollback.sh ${{ matrix.rid }} "$APP"

      - name: updating from the newest GitHub release to this build
        run: |
          pwsh -NoProfile -File tools/package-release.ps1 -OnlyRid ${{ matrix.rid }} -AsVersion 9.9.9
          sh tests/update-from-release.sh ${{ matrix.rid }} "dist/nocat.farm-v9.9.9_${{ matrix.rid }}.zip"

      - name: log
        if: always()
        run: |
          tail -n 60 run.log || true
          for f in signals-test/*.log upd-test/*.log from-release/run.log; do [ -f "$f" ] && { echo "== $f"; tail -n 30 "$f"; }; done || true

  docker:
    name: docker - ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: build the image
        run: docker build -t nocatfarm:test .

      - name: live Steam connection and idling from inside the image (anonymous - no account)
        timeout-minutes: 4
        run: docker run --rm --init nocatfarm:test --steam-selftest

      - name: run it like docker-compose.example.yml
        run: |
          mkdir -p data/config data/logs && chmod 777 data/config data/logs
          # a pretend ArchiSteamFarm folder, mounted read-only where the compose example puts one
          mkdir -p asf/config && echo '{}' > asf/config/ASF.json && echo '{"SteamLogin":"not_a_real_login","Enabled":true}' > asf/config/pretend.json
          docker run -d --name nf --init -e NOCATFARM_WEB_PASSWORD=a-long-test-password-123 -e TZ=Europe/London -e NOCATFARM_PING_URL \
            -p 7242:7242 -v "$PWD/data/config:/data/config" -v "$PWD/data/logs:/data/logs" -v "$PWD/asf:/import/asf:ro" nocatfarm:test
          for i in $(seq 1 60); do curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7242/api/ping | grep -q 200 && break; sleep 1; done
          docker logs nf | tail -n 20

      - name: the password is required, and signing in works
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7242/api/status)
          echo "without signing in: $code"; [ "$code" = "401" ]
          token=$(curl -sf -X POST http://127.0.0.1:7242/api/login -H 'Content-Type: application/json' -d '{"Password":"a-long-test-password-123"}' | sed -E 's/.*"token":"([^"]+)".*/\1/')
          curl -sf http://127.0.0.1:7242/api/status -H "Authorization: Bearer $token" | head -c 200; echo
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7242/api/login -H 'Content-Type: application/json' -d '{"Password":"wrong"}')
          echo "wrong password: $code"; [ "$code" = "401" ]

      - name: a mounted ArchiSteamFarm folder is found by the dashboard's import
        run: |
          token=$(curl -sf -X POST http://127.0.0.1:7242/api/login -H 'Content-Type: application/json' -d '{"Password":"a-long-test-password-123"}' | sed -E 's/.*"token":"([^"]+)".*/\1/')
          curl -sf http://127.0.0.1:7242/api/import/tools -H "Authorization: Bearer $token" | tee tools.json | head -c 400; echo
          python3 -c "import json; t=[x for x in json.load(open('tools.json'))['Tools'] if x['Id']=='asf'][0]; print(t); assert t['Found'] and t['Path'].startswith('/import/asf') and t['Accounts']==1"

      - name: settings and logs land in the mounted folders
        run: |
          ls -la data/config data/logs
          ls data/logs | grep -q .

      - name: the health check answers from inside the image
        run: docker exec nf dotnet /app/nocatFarm.dll --path /data --ping

      - name: clean docker stop
        run: |
          docker stop -t 60 nf
          docker logs nf 2>&1 | grep -q 'shutting down'

      - name: the real docker-compose.example.yml - password, time zone, health, backups across a re-create, a trusted proxy
        run: sh tests/docker-compose.sh

      - name: log
        if: always()
        run: |
          docker logs nf 2>&1 | tail -n 60 || true
          (cd compose-test && docker compose logs --tail 60) 2>/dev/null || true
          tail -n 60 compose-test/logs/*.log 2>/dev/null || true
